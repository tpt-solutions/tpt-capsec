[package]
name = "tpt-capsec-integrations"
version = "0.1.0"
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
description = "Integration layer mapping tpt-capsec capability tokens onto plugin/WASI-style sandboxes"
keywords = ["capability", "wasi", "sandbox", "plugin", "security"]
categories = ["wasm", "development-tools"]
readme = "README.md"

[package.metadata.docs.rs]
all-features = true

[dependencies]
tpt-capsec = { version = "0.1.0", path = "../tpt-capsec" }
serde = { version = "1", optional = true, default-features = false, features = ["derive", "std"] }
# Direct engine adapter. Pinned to one minor line per the documented
# version-compatibility policy; bump deliberately with changelog notes.
wasmtime-wasi = { version = "=24", optional = true, default-features = false }

[features]
default = []
# (De)serialization support for `SandboxPlan` and `PreopenedDir`.
serde = ["dep:serde"]
# Direct wasmtime adapter mapping `SandboxPlan` onto a restricted
# `WasiCtxBuilder`.
wasmtime = ["dep:wasmtime-wasi"]
extism = []

[dev-dependencies]
serde_json = "1"
